<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Absensi Santri</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- PILIH TANGGAL -->
  <ion-item>
    <ion-label>Tanggal</ion-label>
    <ion-datetime
      presentation="date"
      [(ngModel)]="tanggal">
    </ion-datetime>
  </ion-item>

  <ion-list *ngIf="santri.length > 0">

    <ion-item *ngFor="let s of santri">
      <ion-label>
        <h2>{{ s.nama }}</h2>
      </ion-label>

     <ion-segment [(ngModel)]="absensi[s.id]">

        <ion-segment-button value="Hadir">
          Hadir
        </ion-segment-button>

        <ion-segment-button value="Izin">
          Izin
        </ion-segment-button>

        <ion-segment-button value="Sakit">
          Sakit
        </ion-segment-button>

        <ion-segment-button value="Alpa">
          Alpa
        </ion-segment-button>

      </ion-segment>
    </ion-item>

  </ion-list>

  <ion-button
    expand="block"
    color="success"
    class="ion-margin-top"
    (click)="simpanAbsensi()">
    Simpan Absensi
  </ion-button>

</ion-content>
