<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Data Absensi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- FILTER TANGGAL -->
  <ion-item>
    <ion-label position="stacked">Tanggal</ion-label>
    <ion-datetime
      presentation="date"
      [(ngModel)]="tanggal">
    </ion-datetime>
  </ion-item>


  <!-- BUTTON -->
  <ion-button expand="block" color="success" (click)="loadAbsensi()">
    Terapkan Filter
  </ion-button>

  <ion-button expand="block" fill="outline" color="medium" (click)="resetFilter()">
    Reset Filter
  </ion-button>

  <!-- LIST DATA -->
  <ion-list *ngIf="absensi.length > 0">
    <ion-item *ngFor="let a of absensi">
      <ion-label>
        <h3>{{ a.nama }}</h3>
        <p>
          {{ a.tanggal }} —
          <b>{{ a.status | uppercase }}</b>
        </p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- EMPTY STATE -->
  <div *ngIf="absensi.length === 0" style="text-align:center; margin-top:20px;">
    <ion-label color="medium">
      Tidak ada data absensi
    </ion-label>
  </div>

</ion-content>
